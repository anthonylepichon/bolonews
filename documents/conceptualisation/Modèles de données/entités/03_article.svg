<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="750" viewBox="0 0 1080 750" role="img" aria-labelledby="title desc">
  <title id="title">Table article</title>
  <desc id="desc">Colonnes, types SQL et contraintes de la table article.</desc>
  <rect width="1080" height="750" fill="#F5F6F8"/>
  <rect x="20" y="20" width="1040" height="710" rx="16" fill="#FFFFFF" stroke="#C9CDD3"/>
  <path d="M36 20h1008a16 16 0 0 1 16 16v64H20V36a16 16 0 0 1 16-16z" fill="#20242A"/>
  <rect x="20" y="94" width="1040" height="6" fill="#F2C94C"/>
  <text x="50" y="70" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">ARTICLE</text>
  <rect x="40" y="116" width="1000" height="44" rx="7" fill="#FFF6CE"/>
  <g fill="#20242A" font-family="Segoe UI, Arial, sans-serif" font-size="17">
    <text x="60" y="145" font-weight="700">COLONNE</text><text x="350" y="145" font-weight="700">TYPE SQL</text><text x="600" y="145" font-weight="700">CONTRAINTES</text>
    <text x="60" y="202" font-weight="700">id</text><text x="350" y="202">INT</text><text x="600" y="202">PK · AUTO_INCREMENT</text>
    <text x="60" y="254" font-weight="700">author_id</text><text x="350" y="254">INT</text><text x="600" y="254">FK → user.id · NULL · ON DELETE SET NULL</text>
    <text x="60" y="306" font-weight="700">category_id</text><text x="350" y="306">INT</text><text x="600" y="306">FK → category.id · NOT NULL · ON DELETE RESTRICT</text>
    <text x="60" y="358" font-weight="700">title</text><text x="350" y="358">VARCHAR(255)</text><text x="600" y="358">NOT NULL</text>
    <text x="60" y="410" font-weight="700">chapeau</text><text x="350" y="410">VARCHAR(500)</text><text x="600" y="410">NOT NULL</text>
    <text x="60" y="462" font-weight="700">content</text><text x="350" y="462">LONGTEXT</text><text x="600" y="462">NOT NULL</text>
    <text x="60" y="514" font-weight="700">image_filename</text><text x="350" y="514">VARCHAR(255)</text><text x="600" y="514">NOT NULL</text>
    <text x="60" y="566" font-weight="700">created_at</text><text x="350" y="566">DATETIME</text><text x="600" y="566">NOT NULL</text>
    <text x="60" y="618" font-weight="700">updated_at</text><text x="350" y="618">DATETIME</text><text x="600" y="618">NULL</text>
    <text x="60" y="670" font-weight="700">is_published</text><text x="350" y="670">BOOLEAN</text><text x="600" y="670">NOT NULL · DEFAULT FALSE</text>
  </g>
  <g stroke="#E5E7EB">
    <line x1="40" y1="218" x2="1040" y2="218"/><line x1="40" y1="270" x2="1040" y2="270"/>
    <line x1="40" y1="322" x2="1040" y2="322"/><line x1="40" y1="374" x2="1040" y2="374"/>
    <line x1="40" y1="426" x2="1040" y2="426"/><line x1="40" y1="478" x2="1040" y2="478"/>
    <line x1="40" y1="530" x2="1040" y2="530"/><line x1="40" y1="582" x2="1040" y2="582"/>
    <line x1="40" y1="634" x2="1040" y2="634"/><line x1="40" y1="686" x2="1040" y2="686"/>
  </g>
</svg>
