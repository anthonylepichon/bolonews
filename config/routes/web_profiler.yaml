# Présentation : routes techniques du profiler en développement.
# Rôle : exposer la barre de débogage et les pages de diagnostic uniquement en environnement dev.
when@dev:
    web_profiler_wdt:
        resource: '@WebProfilerBundle/Resources/config/routing/wdt.php'
        prefix: /_wdt

    web_profiler_profiler:
        resource: '@WebProfilerBundle/Resources/config/routing/profiler.php'
        prefix: /_profiler
